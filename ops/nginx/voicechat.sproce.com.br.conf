server {
    listen 80;
    listen [::]:80;
    server_name voicechat.sproce.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/voicechat-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voicechat.sproce.com.br;

    ssl_certificate /etc/ssl/voicechat/origin.crt;
    ssl_certificate_key /etc/ssl/voicechat/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/voicechat/access.log;
    error_log /var/log/voicechat/error.log warn;

    client_max_body_size 128k;

    location /healthz {
        proxy_pass http://127.0.0.1:4378/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:4378;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
