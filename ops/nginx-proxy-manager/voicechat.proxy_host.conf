# Voice Chat hostname-specific route for Nginx Proxy Manager.
# Install as a dedicated file under /data/nginx/proxy_host/ on the origin.
server {
  listen 80;
  listen [::]:80;
  server_name voicechat.sproce.com.br;

  include conf.d/include/letsencrypt-acme-challenge.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name voicechat.sproce.com.br;

  ssl_certificate /etc/letsencrypt/live/voicechat.sproce.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/voicechat.sproce.com.br/privkey.pem;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  include conf.d/include/block-exploits.conf;

  access_log /data/logs/voicechat_access.log proxy;
  error_log /data/logs/voicechat_error.log warn;

  client_max_body_size 128k;

  set $forward_scheme http;
  set $server voicechat-backend;
  set $port 4378;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://voicechat-backend:4378$request_uri;
  }
}
